name: tests

# Fork-eigener Test-Lauf fuer Vorschlaege (Pull Requests) an moritzdagee/bumblebee.
# Ergaenzt ci.yml aus dem Originalprojekt: nur bei Pull Requests, reine
# Doku-Aenderungen loesen keinen Lauf aus, ein neuer Push bricht den alten Lauf
# ab, und die eigenen Shell-Skripte unter automation/ werden mit shellcheck
# geprueft.

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'archive/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go vet + go test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  shellcheck:
    name: shellcheck automation/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # automation/bumblebee-scan ist ein zsh-Skript. shellcheck kennt kein zsh,
      # deshalb wird es im bash-Modus geprueft; die benutzten Konstrukte sind in
      # beiden Shells gleich.
      - name: shellcheck
        shell: bash
        run: |
          shopt -s nullglob
          files=()
          for f in automation/*; do
            if [ -f "$f" ] && head -n1 "$f" | grep -qE '^#!.*(sh|bash|zsh)'; then
              files+=("$f")
            fi
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "keine Shell-Skripte unter automation/"
            exit 0
          fi
          shellcheck --version
          shellcheck --shell=bash "${files[@]}"
